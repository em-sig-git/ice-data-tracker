name: ICE metadata scrape

on:
  schedule:
    - cron: "13 7 1,15 * *"
      timezone: "Europe/Riga"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run metadata scraper
        id: scrape
        continue-on-error: true
        run: PYTHONPATH=src python -m ice_data_tracker.main --mode metadata

      # Runs even when the scraper failed so any valid data changes are committed.
      # Failure details remain available in the GitHub Actions execution log.
      - name: Commit and push updates
        if: always()
        run: |
          if git diff --quiet -- data; then
            echo "No data changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if [ "${{ steps.scrape.outcome }}" = "failure" ]; then
            git commit -m "Update ICE data (metadata scrape failed)"
          else
            git commit -m "Update ICE metadata"
          fi
          # The other workflow may have pushed while this job was running
          # (the two crons are only 2 minutes apart on the 1st and 15th).
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push

      - name: Report scrape failure
        if: steps.scrape.outcome == 'failure'
        run: |
          echo "::error::ICE metadata scrape failed - see logs/scrape_history.log in the commit above."
          exit 1
